<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Suivi personnel du master en finance d'entreprise : apprentissage, ressources, certifications, candidatures, compétences et frise.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C8F25A'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='28' fill='%231B2405'%3ECF%3C/text%3E%3C/svg%3E">
<title>Cap Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEEDF4; --surface:#FFFFFF; --surface-2:#F6F5FA; --ink:#17141F; --ink-2:#5F5A70; --line:#E4E2EC; --line-strong:#B9B5C8;
  --lime:#C8F25A; --lime-ink:#1B2405; --violet:#6D4DFF; --violet-soft:#E6E1FF;
  --lav:#E5E1F8; --sky:#DCEBF8; --peach:#FBE3D3; --mint:#DAF2E2;
  --side:#17131F; --side-2:#262032; --side-ink:#EFEBFA; --side-mute:#9A93AE;
  --ok:#1F9D57; --warn:#C77A0A; --bad:#C2413B;
  --f-display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D15; --surface:#1A1724; --surface-2:#221E2E; --ink:#F1EEF9; --ink-2:#A6A0B9; --line:#2D2839; --line-strong:#4A4460;
    --violet:#9A82FF; --violet-soft:#2E2666;
    --lav:#2A2548; --sky:#1B2C3F; --peach:#3B2B23; --mint:#1D3327;
    --side:#0A0810; --side-2:#1B1726;
    --ok:#4CC98A; --warn:#E5A33B; --bad:#EE7B75;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D15; --surface:#1A1724; --surface-2:#221E2E; --ink:#F1EEF9; --ink-2:#A6A0B9; --line:#2D2839; --line-strong:#4A4460;
  --violet:#9A82FF; --violet-soft:#2E2666;
  --lav:#2A2548; --sky:#1B2C3F; --peach:#3B2B23; --mint:#1D3327;
  --side:#0A0810; --side-2:#1B1726;
  --ok:#4CC98A; --warn:#E5A33B; --bad:#EE7B75;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em}
.mono{font-family:var(--f-mono)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:16px;padding:16px;max-width:1360px;margin:0 auto;align-items:start}
.side{position:sticky;top:16px;height:calc(100vh - 32px);max-height:860px;background:var(--side);color:var(--side-ink);border-radius:24px;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--side-mute)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-mute);padding:10px 12px;border-radius:13px;text-align:left;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--side-2);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--violet);color:#fff}
.nav svg,.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;background:var(--side-2);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.side-foot b{font-family:var(--f-display);display:block;font-size:14px}
.side-foot span{font-size:12px;color:var(--side-mute)}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 4px 0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.top h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin-top:6px}
.lede{color:var(--ink-2);max-width:62ch;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:99px;padding:8px 14px;font-weight:500;font-size:13px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--lime);display:block}

.card{background:var(--surface);border-radius:22px;padding:20px;min-width:0}
.card h2{font-size:18px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.muted{color:var(--ink-2)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-home{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

.stat{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.stat .num{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .num small{font-size:16px;font-weight:500;color:var(--ink-2);margin-left:4px}
.stat .lab{font-weight:500}
.stat.lime{background:var(--lime);color:var(--lime-ink)}
.stat.lime .num small,.stat.lime .muted{color:rgba(27,36,5,.7)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--violet)}
.lime .bar{background:rgba(27,36,5,.14)}
.lime .bar>i{background:var(--lime-ink)}

.next{background:var(--lime);color:var(--lime-ink);display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:190px}
.next .eyebrow{color:rgba(27,36,5,.65)}
.next h2{font-size:clamp(22px,2.6vw,30px);line-height:1.12}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--surface);text-decoration:none;width:fit-content}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12px}

.dark{background:var(--side);color:var(--side-ink)}
.dark .eyebrow{color:var(--side-mute)}
.pips{display:flex;gap:8px;margin:14px 0 10px}
.pip{flex:1;height:46px;border-radius:14px;border:1.5px dashed #4A4460;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--side-mute)}
.pip.on{background:var(--lime);border:0;color:var(--lime-ink);font-weight:500}
.pip.bonus{border-color:#6a6383}

.track{display:flex;gap:4px;margin:16px 0 10px;position:relative}
.seg{border-radius:12px;height:42px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;display:flex;align-items:flex-end;overflow:hidden;white-space:nowrap;color:var(--ink)}
.seg.t1{background:var(--lav)}.seg.t2{background:var(--sky)}.seg.t3{background:var(--peach)}.seg.t4{background:var(--mint)}
.now{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px solid var(--ink)}
.now::before{content:"";position:absolute;top:-2px;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}

.folder{position:relative;border:0;text-align:left;border-radius:18px;padding:34px 18px 16px;margin-top:14px;display:flex;flex-direction:column;gap:22px;min-height:132px;color:var(--ink)}
.folder::before{content:"";position:absolute;left:0;top:-14px;width:46%;height:24px;border-radius:14px 14px 0 0;background:inherit}
.folder .ft{font-family:var(--f-mono);font-weight:500;font-size:13px}
.folder .fm{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:auto}
.folder:hover{filter:brightness(.97)}
.tone-lav{background:var(--lav)}.tone-sky{background:var(--sky)}.tone-peach{background:var(--peach)}.tone-mint{background:var(--mint)}
.folder .fp{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.03em;line-height:1}

.course{display:flex;flex-direction:column;gap:14px}
.course-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.07);white-space:nowrap}
:root[data-theme="dark"] .tag{background:rgba(255,255,255,.1)}
.course h3{font-size:20px;line-height:1.15}
.course p.note{color:var(--ink-2);font-size:13px}
.tone{border-radius:22px;padding:20px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:8px 6px;border-radius:12px;cursor:pointer}
.checks label:hover{background:rgba(0,0,0,.04)}
.checks .done{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.checks .opt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);margin-left:6px}
.cb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-content:center;cursor:pointer;flex:none;margin:1px 0 0}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(-45deg) translate(1px,-1px)}
.plink{color:var(--violet);font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.plink:hover{text-decoration:underline}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=date],select{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-height:40px}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(--violet);outline:0}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end}
.form .span2{grid-column:span 2}.form .span1{grid-column:span 1}
.spill{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:6px 26px 6px 12px;font-weight:700;font-size:12px;min-height:0;width:auto;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-repeat:no-repeat}
.s-cible{background-color:var(--lav);color:var(--ink)}
.s-envoyee{background-color:var(--sky);color:var(--ink)}
.s-relance{background-color:var(--peach);color:var(--ink)}
.s-entretien{background-color:var(--violet-soft);color:var(--ink)}
.s-offre{background-color:var(--lime);color:var(--lime-ink)}
.s-acceptee{background-color:var(--ok);color:#fff}
.s-refus{background-color:var(--line);color:var(--ink-2)}
.s-idea{background-color:var(--lav);color:var(--ink)}
.s-prep{background-color:var(--peach);color:var(--ink)}
.s-booked{background-color:var(--sky);color:var(--ink)}
.s-done{background-color:var(--ok);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-weight:500;font-size:12.5px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip b{font-family:var(--f-mono);font-weight:500;margin-left:4px;opacity:.7}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.9fr) auto auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.row.head{border-top:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:0}
.row b{display:block}
.row .sub{color:var(--ink-2);font-size:12.5px}
.iconbtn{border:0;background:transparent;color:var(--ink-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--ink-2)}
.plat{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:16px;padding:14px}
.plat b{font-family:var(--f-display);font-size:16px}
.plat .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}

.phase{display:flex;flex-direction:column;gap:12px}
.phase .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tl{display:flex;flex-direction:column;gap:16px;position:relative}
.you{background:var(--lime);color:var(--lime-ink);font-weight:700;border-radius:99px;padding:3px 10px;font-size:11.5px;font-family:var(--f-mono);white-space:nowrap}
.done-lab{background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px;font-size:11.5px;font-family:var(--f-mono)}
.soon-lab{background:rgba(0,0,0,.07);border-radius:99px;padding:3px 10px;font-size:11.5px;font-family:var(--f-mono)}
:root[data-theme="dark"] .soon-lab{background:rgba(255,255,255,.1)}
.crossed{opacity:.6}
.crossed h3{text-decoration:line-through}
.ringwrap{position:relative;flex:none}

.res-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tier-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 4px 0}
.tier-head h2{font-size:22px}
.tier-head p{color:var(--ink-2)}
.tier-n{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--surface);border-radius:99px;padding:3px 10px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.res{display:flex;flex-direction:column;gap:12px}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink-2)}
.catlab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cost{display:inline-block;border-radius:99px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.res h3{font-size:19px;line-height:1.15}
.res .org{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:4px}
.res .desc{color:var(--ink)}
.res .meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.res .tip{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.res .links{display:flex;gap:8px;flex-wrap:wrap}
.res-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.seen{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500;font-size:13px}
.vfy{font-size:12px;display:inline-flex;gap:6px;align-items:center}
.vfy.ok{color:var(--ok)}
.vfy.part{color:var(--warn)}
.vfy svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.watch{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.watch li{display:flex;gap:10px;align-items:flex-start}
.watch li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.plinks{display:flex;gap:10px;flex-wrap:wrap}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag,:root:not([data-theme="light"]) .soon-lab{background:rgba(255,255,255,.1)}
  :root:not([data-theme="light"]) .checks label:hover{background:rgba(255,255,255,.05)}
}
:root[data-theme="dark"] .checks label:hover{background:rgba(255,255,255,.05)}

@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-home{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;max-height:none;flex-direction:row;align-items:center;padding:10px;border-radius:20px;gap:10px;overflow-x:auto}
  .brand span,.side-foot{display:none}
  .brand b{display:none}
  .nav{flex-direction:row}
  .nav button{padding:9px 12px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .span2{grid-column:span 2}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .row.head{display:none}
  .row .c-plat,.row .c-type,.row .c-date{grid-column:1;font-size:12.5px;color:var(--ink-2)}
  .row .c-status{grid-column:1}
  .row .c-del{grid-column:2;grid-row:1}
}
@media (max-width:520px){
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stat .num{font-size:36px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .5s ease}
  .folder,.btn,.nav button{transition:filter .15s,background .15s,opacity .15s}
}
</style>

    <div class="side-foot" id="sidefoot"></div>

</div>

async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    db=await window.claude.use("db");
    if(!db) return;
    docRef=db.doc("app/state");
    docRef.onSnapshot(function(snap){
      if(!snap.exists){ if(!dirty){dirty=true;flush();} return; }
      var d=snap.data(); if(!d||!d.json||dirty) return;
      try{
        var remote=norm(JSON.parse(d.json));
        if(JSON.stringify(remote)!==JSON.stringify(S)){
          S=remote;
          try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
          var a=document.activeElement;
          if(!(a&&a.closest&&a.closest("form"))) render();
        }
      }catch(e){}
    },function(){});
  }catch(e){}
}

/* ---------- Utilitaires ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pct(a,b){return b?Math.round(a/b*100):0;}
function bar(p){return '<div class="bar" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>';}
function ring(p,size,stroke){
  var r=(size-stroke)/2,c=2*Math.PI*r,h=size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+p+' %">'+
   '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="#3a3350" stroke-width="'+stroke+'"/>'+
   '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="#C8F25A" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 '+h+' '+h+')"/>'+
   '<text x="'+h+'" y="'+(h+4)+'" text-anchor="middle" fill="#EFEBFA" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500">'+p+'%</text></svg>';
}
function isDone(id){return !!S.checks[id];}
function today(){return new Date();}

/* ---------- Statistiques ---------- */
function learnStats(){var d=0,t=0;LEARN.forEach(function(c){for(var i=0;i<3;i++){t++;if(isDone(c.id+"."+i))d++;}});return {d:d,t:t,p:pct(d,t)};}
function courseStats(c){var d=0;for(var i=0;i<3;i++)if(isDone(c.id+"."+i))d++;return {d:d,t:3,p:pct(d,3)};}
function skillStat(s){var d=0;s.steps.forEach(function(_,i){if(isDone(s.id+"."+i))d++;});return {d:d,t:s.steps.length,p:pct(d,s.steps.length)};}
function skillStats(){var d=0,t=0;SKILLS.forEach(function(s){if(!s.count)return;var x=skillStat(s);d+=x.d;t+=x.t;});return {d:d,t:t,p:pct(d,t)};}
function certState(id){return (S.cert[id]&&S.cert[id].status)||"idea";}
function certStats(){var n=0;CERTS.forEach(function(c){if(c.counts&&certState(c.id)==="done")n++;});return {n:n,p:Math.min(100,pct(n,2)),toeic:certState("c_toeic")==="done"};}
function appStats(){
  var sent=0,acc=0,live=0;
  S.apps.forEach(function(a){if(a.status!=="cible")sent++;if(a.status==="acceptee")acc++;if(["envoyee","relance","entretien","offre"].indexOf(a.status)>-1)live++;});
  return {sent:sent,acc:acc,live:live,total:S.apps.length};
}
function globalPct(){
  var L=learnStats(),K=skillStats(),C=certStats(),A=appStats();
  return Math.round((L.p+K.p+C.p+Math.min(100,pct(A.acc,2)))/4);
}
function nextStep(){
  for(var i=0;i<LEARN.length;i++)for(var j=0;j<3;j++)if(!isDone(LEARN[i].id+"."+j))return {t:LEARN[i].title,s:LEARN[i].steps[j],v:"apprendre"};
  for(var k=0;k<SKILLS.length;k++){if(!SKILLS[k].count)continue;for(var m=0;m<SKILLS[k].steps.length;m++)if(!isDone(SKILLS[k].id+"."+m))return {t:SKILLS[k].title,s:SKILLS[k].steps[m],v:"competences"};}
  return null;
}
function phaseState(p){var n=today();return n>=p.to?"past":(n>=p.from?"now":"soon");}

/* ---------- Composants ---------- */
function checklist(id,steps,optFrom){
  return '<ul class="checks">'+steps.map(function(s,i){
    var key=id+"."+i,on=isDone(key),opt=optFrom!=null&&i>=optFrom;
    return '<li><label><input class="cb" type="checkbox" data-check="'+key+'"'+(on?" checked":"")+'><span class="'+(on?"done":"")+'">'+esc(s)+(opt?'<span class="opt">option</span>':"")+'</span></label></li>';
  }).join("")+'</ul>';
}
function head(eyebrow,title,lede,right){
  return '<header class="top"><div><p class="eyebrow">'+esc(eyebrow)+'</p><h1>'+esc(title)+'</h1>'+(lede?'<p class="lede">'+esc(lede)+'</p>':"")+'</div>'+(right||"")+'</header>';
}

function resList(){
  var q=UI.q.trim().toLowerCase(),html="",found=0;
  TIERS.forEach(function(t){
    var items=RES.filter(function(r){
      if(r.tier!==t.n)return false;
      if(UI.rescat!=="all"&&r.cat!==UI.rescat)return false;
      if(q&&(r.name+" "+r.org+" "+r.desc+" "+CATLAB[r.cat]).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
    if(!items.length)return;
    found+=items.length;
    html+='<div class="tier-head"><span class="tier-n">Niveau '+t.n+'</span><h2>'+esc(t.t)+'</h2><p>'+esc(t.d)+'</p></div><div class="resgrid">'+items.map(resCard).join("")+'</div>';
  });
  return found?html:'<div class="card"><p class="empty">Aucune ressource ne correspond. Essaie un autre mot-clé ou une autre catégorie.</p></div>';
}
function vRes(){
  var seen=RES.filter(function(r){return isDone("res."+r.id);}).length;
  var chips=CATS.map(function(c){return '<button class="fchip" aria-pressed="'+(UI.rescat===c[0])+'" data-rescat="'+c[0]+'">'+c[1]+'</button>';}).join("");
  return head("Ressources","Les bons liens, dans l'ordre","Chaque ressource est classée par priorité : le numéro indique l'ordre conseillé, du niveau 1 au niveau 3.",'<span class="chip"><i></i>'+seen+' / '+RES.length+' consultées</span>')+
  '<section class="grid g2">'+
   '<div class="card tone-mint"><p class="eyebrow">Méthode</p><h2 style="margin:6px 0 8px">Liens ouverts et lus le '+VERIF_DATE+'</h2><p class="muted">Chaque lien a été ouvert, et son contenu comparé à la description affichée : titre, durée, tarif, contenu. Trois sources restent signalées en orange : deux bloquent la lecture automatique (LinkFinance, LinkedIn), une troisième a un statut de session incertain (le MOOC tableur de l\'IAE Montpellier).</p></div>'+
   '<div class="card tone-peach"><p class="eyebrow">Points de vigilance</p><ul class="watch" style="margin-top:10px">'+
    '<li><span>Le parcours Lefebvre Dalloz coûte <b>5 900 € HT</b> : compare-le avec le certificat du Cnam.</span></li>'+
    '<li><span>Les trois cours d\'apprentissage principaux (OpenClassrooms) sont gratuits à lire, en libre accès permanent ; seul un parcours complet certifiant est payant.</span></li>'+
    '<li><span>Les MOOC Cnam/FUN restants n\'affichent pas leurs dates de session, et deux d\'entre eux n\'ont plus eu de session connue depuis 2018 et fin 2022 : vérifie qu\'une session est ouverte avant de t\'y fier.</span></li>'+
   '</ul></div>'+
  '</section>'+
  '<section class="card"><div class="res-tools"><div class="field" style="flex:1;min-width:220px"><label for="resq">Rechercher</label><input type="text" id="resq" value="'+esc(UI.q)+'" placeholder="Power BI, TOEIC, LinkFinance…" autocomplete="off"></div></div><div class="filters" style="margin:14px 0 0">'+chips+'</div></section>'+
  '<div id="reslist" class="main" style="gap:16px">'+resList()+'</div>';
}

var VIEWS=[
 {id:"home",label:"Accueil",icon:"home",fn:vHome},
 {id:"apprendre",label:"Apprentissage",icon:"book",fn:vLearn},
 {id:"ressources",label:"Ressources",icon:"link",fn:vRes},
 {id:"certifs",label:"Certifications",icon:"badge",fn:vCerts},
 {id:"stage",label:"Stage et alternance",icon:"brief",fn:vStage},
 {id:"competences",label:"Compétences",icon:"chart",fn:vSkills},
 {id:"frise",label:"Frise",icon:"route",fn:vFrise}
];

function render(){
  var cur=VIEWS.filter(function(v){return v.id===UI.view;})[0]||VIEWS[0];
  document.getElementById("nav").innerHTML=VIEWS.map(function(v){return '<button data-go="'+v.id+'"'+(v.id===cur.id?' aria-current="page"':"")+'>'+ico(v.icon)+'<span>'+v.label+'</span></button>';}).join("");
  var g=globalPct();
  document.getElementById("sidefoot").innerHTML='<div class="ringwrap">'+ring(g,58,6)+'</div><div><b>Parcours global</b><span>Moyenne des quatre axes</span></div>';
  document.getElementById("view").innerHTML=cur.fn();
}
function go(v){
  UI.view=v;try{localStorage.setItem(LS+".view",v);}catch(e){}
  render();window.scrollTo(0,0);
}

/* ---------- Événements ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-filter],[data-delapp],[data-rescat]");
  if(!t)return;
  if(t.dataset.go){go(t.dataset.go);}
  else if(t.dataset.rescat){UI.rescat=t.dataset.rescat;render();}
  else if(t.dataset.filter){UI.filter=t.dataset.filter;render();}
  else if(t.dataset.delapp){S.apps=S.apps.filter(function(a){return a.id!==t.dataset.delapp;});save();render();}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.check!==undefined&&t.dataset.check!==""){
    if(t.checked)S.checks[t.dataset.check]=true;else delete S.checks[t.dataset.check];
    save();render();
  }else if(t.dataset.cert){
    S.cert[t.dataset.cert]=Object.assign({},S.cert[t.dataset.cert],{status:t.value});save();render();
  }else if(t.dataset.certdate){
    S.cert[t.dataset.certdate]=Object.assign({},S.cert[t.dataset.certdate],{date:t.value});save();
  }else if(t.dataset.appstatus){
    S.apps.forEach(function(a){if(a.id===t.dataset.appstatus)a.status=t.value;});save();render();
  }
});
document.addEventListener("input",function(e){
  if(e.target.id!=="resq")return;
  UI.q=e.target.value;
  var box=document.getElementById("reslist");
  if(box)box.innerHTML=resList();
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="appform")return;
  e.preventDefault();
  var f=new FormData(e.target),company=String(f.get("company")||"").trim();
  if(!company)return;
  S.apps.unshift({id:"a"+Date.now().toString(36),company:company,role:String(f.get("role")||"").trim(),platform:String(f.get("platform")||""),type:String(f.get("type")||"Stage"),status:String(f.get("status")||"envoyee"),date:String(f.get("date")||"")});
  UI.filter="all";save();render();
});

render();
initDb();
})();
</script>

</body>
</html>
